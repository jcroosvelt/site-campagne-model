# Environnement local / démonstration : PostgreSQL + application.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campagne
      POSTGRES_PASSWORD: campagne
      POSTGRES_DB: campagne
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://campagne:campagne@db:5432/campagne?schema=public
    ports: ["3000:3000"]
    volumes: [uploads:/app/public/uploads]
    depends_on: [db]
volumes:
  pgdata:
  uploads:
